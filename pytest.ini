[pytest]
pythonpath = .
testpaths = tests
log_level = WARNING

addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=70

markers =
    unit: unit-тесты бизнес-логики (predictor)
    integration: integration-тесты API endpoints
    slow: тесты с внешними API-вызовами (могут быть медленными)

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::UserWarning:sqlalchemy.*